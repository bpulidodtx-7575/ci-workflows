name: Node dead-code & slop (reusable)

# knip (dead code / unused deps) and aislop (AI-slop score gate) against a
# single npm package. A single run — no matrix — since neither gate's result
# changes with the Node version; see node-build-test.yml for the part that
# does.

on:
  workflow_call:
    inputs:
      working-directory:
        description: "Path to the package, relative to the repo root (e.g. 'files', 'cards-in-box-app', or '.' for the repo root)."
        required: true
        type: string
      cache-dependency-path:
        description: "Path to package-lock.json, relative to the repo root, for actions/setup-node's npm cache key."
        required: true
        type: string
      node-version:
        description: "Node version for setup-node."
        required: false
        type: string
        default: "20"
      run-deadcode:
        description: "Run `npm run deadcode` (knip)."
        required: false
        type: boolean
        default: true
      run-slop:
        description: "Run `npm run slop:ci` (aislop)."
        required: false
        type: boolean
        default: true
      upload-sarif:
        description: >-
          Upload the aislop SARIF to the repo's Security tab. Only works on
          public repos, or private repos with GitHub Advanced Security
          enabled — leave false otherwise (the upload step fails loudly if
          the repo can't accept it, so this is opt-in, not auto-detected).
        required: false
        type: boolean
        default: false

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Only used when upload-sarif is true, to publish aislop findings to
      # the Security tab. Nothing here writes to the repository.
      security-events: write
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.cache-dependency-path }}

      - name: Install dependencies
        run: npm ci

      - name: Dead code and unused dependencies
        if: ${{ inputs.run-deadcode }}
        run: npm run deadcode

      # Written before the gate runs so the findings still reach the Security
      # tab on a failing score, which is exactly when they are worth reading.
      - name: Generate aislop SARIF
        if: ${{ inputs.run-slop && inputs.upload-sarif }}
        run: npx aislop ci --sarif > aislop.sarif || true

      - name: Upload aislop SARIF
        if: ${{ inputs.run-slop && inputs.upload-sarif }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ inputs.working-directory }}/aislop.sarif
          category: aislop

      - name: AI-slop score gate
        if: ${{ inputs.run-slop }}
        run: npm run slop:ci
